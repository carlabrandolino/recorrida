<title>Recorrida Juzgados y Salas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:        #f5f0eb;
    --surface:   #ffffff;
    --surface2:  #fdf8f4;
    --border:    #e8dfd6;
    --mint:      #b8e4d4;
    --mint-dark: #5bbf9f;
    --mint-text: #2d7a61;
    --peach:     #f7c8b0;
    --peach-dark:#e87e50;
    --peach-text:#8a3e1e;
    --lavender:  #d4c8f0;
    --lav-dark:  #9278d8;
    --lav-text:  #4a2f8a;
    --sky:       #bcd8f0;
    --sky-dark:  #5295cc;
    --sky-text:  #1d4e78;
    --rose:      #f5c2cc;
    --rose-dark: #d95c72;
    --rose-text: #7a1e30;
    --yellow:    #f7e8a0;
    --yel-dark:  #c8a800;
    --yel-text:  #5a4500;
    --text:      #2d2520;
    --muted:     #9e8e84;
    --shadow:    0 2px 12px rgba(0,0,0,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* HEADER */
  header {
    background: var(--surface);
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .header-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
  .app-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; letter-spacing:-0.5px; line-height:1.1; }
  .app-title strong { color:var(--mint-dark); }
  .header-date { font-size:11px; color:var(--muted); font-weight:700; margin-top:3px; text-transform:capitalize; }
  .new-btn {
    background:var(--yellow); color:var(--yel-text); border:2px solid var(--yel-dark);
    border-radius:12px; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
    padding:9px 14px; cursor:pointer; -webkit-appearance:none; width:100%; text-align:center; transition:all 0.15s;
  }
  .new-btn:disabled { opacity:0.3; cursor:default; }
  .new-btn:not(:disabled):active { background:var(--yel-dark); color:#fff; }

  /* NOTICE */
  .notice { margin:12px 16px 0; background:var(--yellow); border:1.5px solid var(--yel-dark); border-radius:14px; padding:11px 14px; font-size:12px; color:var(--yel-text); line-height:1.55; display:none; font-weight:600; }
  .notice.visible { display:block; }

  /* CARD */
  .card { background:var(--surface); margin:12px 16px 0; border-radius:18px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .card-label { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); margin-bottom:10px; }

  /* BUILDING GRID */
  .building-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
  .bld-btn {
    border:2px solid var(--border); border-radius:12px; padding:10px; background:var(--surface2);
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; color:var(--muted);
    cursor:pointer; text-align:center; transition:all 0.18s; -webkit-appearance:none; line-height:1.3;
  }
  .bld-btn:active { transform:scale(0.97); }
  .bld-btn[data-c="mint"].on  { background:var(--mint);     border-color:var(--mint-dark);  color:var(--mint-text); }
  .bld-btn[data-c="peach"].on { background:var(--peach);    border-color:var(--peach-dark); color:var(--peach-text); }
  .bld-btn[data-c="lav"].on   { background:var(--lavender); border-color:var(--lav-dark);   color:var(--lav-text); }
  .bld-btn[data-c="sky"].on   { background:var(--sky);      border-color:var(--sky-dark);   color:var(--sky-text); }
  .bld-btn[data-c="rose"].on  { background:var(--rose);     border-color:var(--rose-dark);  color:var(--rose-text); }

  /* JUZGADO */
  .juz-row { display:flex; gap:8px; align-items:center; }
  .juz-input {
    flex:0 0 80px; width:80px; background:var(--surface2); border:2px solid var(--border);
    border-radius:12px; color:var(--text); font-family:'Nunito',sans-serif; font-size:15px;
    font-weight:800; padding:10px 14px; outline:none; transition:border-color 0.2s;
    -webkit-appearance:none; text-align:center;
  }
  .juz-input:focus { border-color:var(--mint-dark); background:#fff; }
  .juz-confirm-btn {
    flex:1; background:var(--mint); color:var(--mint-text); border:2px solid var(--mint-dark);
    border-radius:12px; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
    padding:10px 16px; cursor:pointer; -webkit-appearance:none; transition:all 0.15s;
  }
  .juz-confirm-btn:active { background:var(--mint-dark); color:#fff; }
  .juz-confirmed {
    margin-top:10px; background:var(--surface2); border:1.5px solid var(--border);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; color:var(--text);
    display:none; align-items:center; justify-content:space-between;
  }
  .juz-confirmed.visible { display:flex; }
  .change-link { font-size:11px; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; font-weight:700; }

  /* MIC */
  .mic-card { background:var(--surface); margin:10px 16px 0; border-radius:18px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .live-box { width:100%; background:#edfaf5; border:2px dashed var(--mint-dark); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--mint-text); line-height:1.5; font-weight:600; display:none; min-height:40px; }
  .live-box.on { display:block; }
  .mic-action {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; border-radius:16px; font-family:'Nunito',sans-serif;
    font-weight:800; font-size:16px; cursor:pointer; border:2px solid transparent;
    -webkit-appearance:none; transition:all 0.18s;
  }
  .mic-start { background:var(--mint); color:var(--mint-text); border-color:var(--mint-dark); }
  .mic-start:active { background:var(--mint-dark); color:#fff; }
  .mic-stop  { background:var(--rose); color:var(--rose-text); border-color:var(--rose-dark); }
  .mic-stop:active  { background:var(--rose-dark); color:#fff; }
  .rec-indicator { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--rose-dark); }
  .rec-dot { width:12px; height:12px; background:var(--rose-dark); border-radius:50%; animation:blink 1s infinite; flex-shrink:0; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .mode-toggle { font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* FALLBACK TEXT */
  .text-card { background:var(--surface); margin:10px 16px 0; border-radius:18px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--border); display:none; }
  .text-card.on { display:block; }
  .text-row { display:flex; gap:8px; align-items:flex-end; }
  .text-area {
    flex:1; background:var(--surface2); border:2px solid var(--border); border-radius:12px;
    color:var(--text); font-family:'Nunito',sans-serif; font-size:13px; font-weight:600;
    padding:11px 14px; resize:none; height:76px; outline:none; transition:border-color 0.2s;
    -webkit-appearance:none; line-height:1.5;
  }
  .text-area:focus { border-color:var(--mint-dark); }
  .text-area::placeholder { color:var(--muted); font-size:12px; }
  .save-btn {
    background:var(--mint); color:var(--mint-text); border:2px solid var(--mint-dark);
    border-radius:12px; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
    padding:0 16px; height:76px; cursor:pointer; -webkit-appearance:none; white-space:nowrap; transition:all 0.15s;
  }
  .save-btn:active { background:var(--mint-dark); color:#fff; }

  /* ENTRIES */
  .entries-wrap { flex:1; overflow-y:auto; padding:10px 16px 16px; -webkit-overflow-scrolling:touch; }
  .entries-hdr { display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg); padding:6px 0 10px; z-index:10; }
  .entries-title { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); }
  .clear-btn { background:none; border:2px solid var(--border); border-radius:8px; color:var(--muted); font-family:'Nunito',sans-serif; font-weight:700; font-size:11px; padding:4px 10px; cursor:pointer; -webkit-appearance:none; transition:all 0.15s; }
  .clear-btn:active { border-color:var(--rose-dark); color:var(--rose-dark); }
  .empty-box { background:var(--surface); border:1.5px dashed var(--border); border-radius:16px; min-height:64px; }
  .entry-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:13px 14px; margin-bottom:9px; box-shadow:var(--shadow); animation:slidein 0.22s ease; }
  @keyframes slidein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .entry-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
  .entry-left { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
  .entry-tag { font-size:13px; font-weight:800; padding:4px 12px; border-radius:20px; display:inline-block; width:fit-content; }
  .entry-juz { font-size:14px; font-weight:800; color:var(--text); padding-left:2px; }
  .entry-right { display:flex; align-items:center; gap:8px; flex-shrink:0; margin-left:8px; }
  .entry-time { font-size:13px; color:var(--muted); font-weight:600; }
  .entry-del { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 2px; line-height:1; -webkit-appearance:none; font-weight:700; transition:color 0.15s; }
  .entry-del:active { color:var(--rose-dark); }
  .entry-text { font-size:15px; color:var(--text); line-height:1.55; font-weight:600; }

  /* BOTTOM */
  .bottom { background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .copy-btn { width:100%; background:var(--peach); color:var(--peach-text); border:2px solid var(--peach-dark); border-radius:16px; font-family:'Nunito',sans-serif; font-weight:800; font-size:15px; padding:15px; cursor:pointer; transition:all 0.15s; -webkit-appearance:none; }
  .copy-btn:not(:disabled):active { background:var(--peach-dark); color:#fff; transform:scale(0.98); }
  .copy-btn:disabled { opacity:0.35; cursor:default; }

  /* TOAST */
  .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--mint-dark); color:#fff; font-family:'Nunito',sans-serif; font-weight:800; font-size:15px; padding:13px 28px; border-radius:50px; opacity:0; pointer-events:none; transition:all 0.25s; z-index:200; white-space:nowrap; box-shadow:0 4px 20px rgba(91,191,159,0.4); }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:500; align-items:center; justify-content:center; padding:24px; }
  .modal-overlay.on { display:flex; }
  .modal-box { background:var(--surface); border-radius:20px; padding:24px 20px 16px; width:100%; max-width:320px; box-shadow:0 8px 32px rgba(0,0,0,0.18); font-family:'Nunito',sans-serif; }
  .modal-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; color:var(--text); margin-bottom:6px; }
  .modal-body { font-size:14px; color:var(--muted); font-weight:600; margin-bottom:20px; }
  .modal-btns { display:flex; gap:10px; }
  .modal-cancel { flex:1; padding:13px; border-radius:12px; border:2px solid var(--border); background:var(--surface2); font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; -webkit-appearance:none; }
  .modal-confirm { flex:1; padding:13px; border-radius:12px; border:2px solid var(--rose-dark); background:var(--rose); font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; color:var(--rose-text); cursor:pointer; -webkit-appearance:none; }

  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="app-title">Recorrida <strong>Juzgados y Salas</strong></div>
      <div class="header-date" id="headerDate"></div>
    </div>
  </div>
  <button class="new-btn" id="newBtn" onclick="newRecorrida()" disabled>🗓️ Nueva recorrida</button>
</header>

<div class="notice" id="notice"></div>

<!-- EDIFICIOS + JUZGADO -->
<div class="card">
  <div class="card-label">📍 Edificios</div>
  <div class="building-grid" id="bldGrid"></div>
  <div class="card-label" style="margin-top:14px">🔢 Juzgados / Salas / SG</div>
  <div class="juz-row">
    <input class="juz-input" id="juzInput" type="text" inputmode="numeric" placeholder="" maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="juz-confirm-btn" id="juzConfirmBtn" onclick="confirmJuz()">Confirmar ✓</button>
  </div>
  <div class="juz-confirmed" id="juzConfirmed">
    <span id="juzConfirmedText"></span>
    <span class="change-link" onclick="changeJuz()">cambiar</span>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" id="modalConfirm"></button>
    </div>
  </div>
</div>

<!-- MIC -->
<div class="mic-card" id="micCard">
  <div class="live-box" id="liveBox"></div>
  <div id="micIdle" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
    <button class="mic-action mic-start" onclick="startMic()">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 18.93V22h2v-2.07A8 8 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
      Iniciar grabación
    </button>
    <div class="mode-toggle" onclick="showText()">✏️ Prefiero escribir</div>
  </div>
  <div id="micRec" style="display:none;flex-direction:column;align-items:center;gap:12px;width:100%">
    <div class="rec-indicator"><span class="rec-dot"></span> Grabando…</div>
    <button class="mic-action mic-stop" onclick="stopMic()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      Detener y guardar
    </button>
  </div>
</div>

<!-- TEXTO -->
<div class="text-card" id="textCard">
  <div class="card-label">✏️ Escribí lo que hiciste</div>
  <div class="text-row">
    <textarea class="text-area" id="textArea" placeholder="Ej: hice 3 infoleg y conecté una impresora Lexmark…"></textarea>
    <button class="save-btn" onclick="saveText()">Guardar ✓</button>
  </div>
  <div class="mode-toggle" style="margin-top:12px;text-align:center" onclick="showMic()">🎙 Prefiero el micrófono</div>
</div>

<!-- REGISTRO -->
<div class="entries-wrap">
  <div class="entries-hdr">
    <span class="entries-title">📋 Registro del día</span>
    <button class="clear-btn" onclick="clearAll()">Borrar todo</button>
  </div>
  <div id="entryList"></div>
</div>

<div class="bottom">
  <button class="copy-btn" id="copyBtn" onclick="copyAll()" disabled>Copiar todo</button>
</div>

<div class="toast" id="toast">¡Copiado! ✓</div>

<script>
// ── DATOS ─────────────────────────────────────────────────────
const BLDS = [
  { name:'Lavalle 1268',                 c:'mint'  },
  { name:'Lavalle 1554',                 c:'peach' },
  { name:'Paraná 520',                   c:'sky'   },
  { name:'Cerrito 264',                  c:'lav'   },
  { name:'Diag. Roque Sáenz Peña 1190', c:'rose'  },
];
const TAG = {
  mint:  { bg:'#b8e4d4', col:'#2d7a61' },
  peach: { bg:'#f7c8b0', col:'#8a3e1e' },
  sky:   { bg:'#bcd8f0', col:'#1d4e78' },
  lav:   { bg:'#d4c8f0', col:'#4a2f8a' },
  rose:  { bg:'#f5c2cc', col:'#7a1e30' },
};
const AUTOCORRECT = {
  'info leg':'infoleg','info lek':'infoleg','infolek':'infoleg',
  'info lec':'infoleg','infolec':'infoleg','infolego':'infoleg',
  'info legs':'infoleg','lex mark':'Lexmark','wi fi':'WiFi',
};
function fixText(t) {
  let r = t;
  for (const [w,c] of Object.entries(AUTOCORRECT))
    r = r.replace(new RegExp(w,'gi'), c);
  return r;
}

// ── STATE ──────────────────────────────────────────────────────
let entries = [];
try { entries = JSON.parse(localStorage.getItem('juz_v2') || '[]'); } catch(e){}
let selBld = null, confNum = '', confColor = 'sky';
let isRec = false, recognition = null, interim = '';
let modalCb = null;

// ── INIT ───────────────────────────────────────────────────────
(function init() {
  // date
  const d = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('headerDate').textContent = d.charAt(0).toUpperCase()+d.slice(1);

  // building grid
  const grid = document.getElementById('bldGrid');
  grid.innerHTML = BLDS.map((b,i) => {
    const span = (BLDS.length % 2 !== 0 && i === BLDS.length-1) ? 'grid-column:1/-1;' : '';
    return `<button class="bld-btn" data-c="${b.c}" style="${span}" onclick="pickBld(${i},this)">${b.name}</button>`;
  }).join('');

  // modal close on overlay click
  document.getElementById('modal').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });

  // textarea enter
  document.getElementById('textArea').addEventListener('keydown', e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); saveText(); }
  });

  render();
})();

// ── BUILDING ───────────────────────────────────────────────────
function pickBld(i, el) {
  selBld = i;
  confNum = ''; confColor = BLDS[i].c;
  document.querySelectorAll('.bld-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  // always reset juz field
  document.getElementById('juzInput').value = '';
  document.getElementById('juzInput').style.display = '';
  document.getElementById('juzConfirmBtn').style.display = '';
  document.getElementById('juzConfirmed').classList.remove('visible');
  document.getElementById('juzInput').focus();
}

// ── JUZGADO ────────────────────────────────────────────────────
function confirmJuz() {
  const num = document.getElementById('juzInput').value.trim();
  if (!num) { document.getElementById('juzInput').focus(); return; }
  if (selBld === null) { showNotice('Primero elegí un edificio 👆'); return; }
  confNum = num; confColor = BLDS[selBld].c;
  document.getElementById('juzConfirmedText').textContent = '✓ ' + BLDS[selBld].name + ' – ' + num;
  document.getElementById('juzConfirmed').classList.add('visible');
  document.getElementById('juzInput').style.display = 'none';
  document.getElementById('juzConfirmBtn').style.display = 'none';
}
function changeJuz() {
  confNum = '';
  document.getElementById('juzConfirmed').classList.remove('visible');
  document.getElementById('juzInput').style.display = '';
  document.getElementById('juzConfirmBtn').style.display = '';
  document.getElementById('juzInput').value = '';
  document.getElementById('juzInput').focus();
}
function getBld()  { return selBld !== null ? BLDS[selBld].name : 'Sin edificio'; }
function getJuz()  { return confNum || document.getElementById('juzInput').value.trim() || 'Sin juzgado'; }
function getColor(){ return confColor || 'sky'; }

// ── MODE SWITCH ────────────────────────────────────────────────
function showText() {
  document.getElementById('micCard').style.display = 'none';
  document.getElementById('textCard').classList.add('on');
}
function showMic() {
  document.getElementById('textCard').classList.remove('on');
  document.getElementById('micCard').style.display = 'flex';
}

// ── SAVE TEXT ─────────────────────────────────────────────────
function saveText() {
  const t = document.getElementById('textArea').value.trim();
  if (!t) return;
  addEntry(getBld(), getJuz(), fixText(t), getColor());
  document.getElementById('textArea').value = '';
}

// ── SPEECH ─────────────────────────────────────────────────────
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showNotice('⚠️ Tu navegador no soporta voz. Usá Safari en el iPhone.'); showText(); return; }
  recognition = new SR();
  recognition.lang = 'es-AR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRec = true;
    document.getElementById('micIdle').style.display = 'none';
    document.getElementById('micRec').style.display = 'flex';
    document.getElementById('liveBox').classList.add('on');
  };
  recognition.onresult = e => {
    let fin = '', intr = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else intr += t;
    }
    if (fin) interim += fin;
    document.getElementById('liveBox').textContent = interim + intr;
  };
  recognition.onerror = e => {
    recognition.onend = null; isRec = false; resetMic();
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      showNotice('⚠️ Micrófono denegado. Abrí desde HTTPS. Usá el modo texto.');
    else if (e.error !== 'aborted')
      showNotice('⚠️ Error de micrófono: ' + e.error);
    showText();
  };
  recognition.onend = () => { if (isRec) { try { recognition.start(); } catch(e){} } };
  interim = '';
  try { recognition.start(); } catch(e) { showNotice('No se pudo iniciar el micrófono.'); showText(); }
}
function stopMic() {
  isRec = false;
  if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
  resetMic();
  const t = fixText(interim.trim());
  if (t) addEntry(getBld(), getJuz(), t, getColor());
  interim = '';
  document.getElementById('liveBox').textContent = '';
}
function resetMic() {
  document.getElementById('micIdle').style.display = 'flex';
  document.getElementById('micRec').style.display = 'none';
  document.getElementById('liveBox').classList.remove('on');
}

// ── ENTRIES ────────────────────────────────────────────────────
function addEntry(bld, juz, text, color) {
  const time = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  entries.unshift({ id:Date.now(), bld, juz, text, time, color });
  save(); render();
}
function delEntry(id) { entries = entries.filter(e => e.id !== id); save(); render(); }
function clearAll() {
  if (!entries.length) return;
  openModal('¿Borrar todas las notas?', '', 'Borrar todo', () => { entries=[]; save(); render(); });
}
function newRecorrida() {
  if (!entries.length) return;
  openModal('¿Nueva recorrida?', 'Se borran todas las notas del día.', 'Borrar y empezar', () => {
    entries=[]; save(); render();
    selBld=null; confNum=''; confColor='sky';
    document.querySelectorAll('.bld-btn').forEach(b=>b.classList.remove('on'));
    document.getElementById('juzInput').value='';
    document.getElementById('juzInput').style.display='';
    document.getElementById('juzConfirmBtn').style.display='';
    document.getElementById('juzConfirmed').classList.remove('visible');
  });
}
function save() { try { localStorage.setItem('juz_v2', JSON.stringify(entries)); } catch(e){} }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const n = entries.length;
  document.getElementById('copyBtn').disabled = n === 0;
  document.getElementById('newBtn').disabled  = n === 0;
  const list = document.getElementById('entryList');
  if (!n) { list.innerHTML = '<div class="empty-box"></div>'; return; }
  list.innerHTML = entries.map(e => {
    const s = TAG[e.color] || TAG.sky;
    return `<div class="entry-card">
      <div class="entry-top">
        <div class="entry-left">
          <span class="entry-tag" style="background:${s.bg};color:${s.col}">${esc(e.bld)}</span>
          <span class="entry-juz">Juzgado ${esc(e.juz)}</span>
        </div>
        <div class="entry-right">
          <span class="entry-time">${e.time}</span>
          <button class="entry-del" onclick="delEntry(${e.id})">×</button>
        </div>
      </div>
      <div class="entry-text">${esc(e.text)}</div>
    </div>`;
  }).join('');
}

// ── COPY ───────────────────────────────────────────────────────
function copyAll() {
  if (!entries.length) return;
  const txt = [...entries].reverse()
    .map(e => `[${e.time}] ${e.bld} – Juzgado ${e.juz}\n${e.text}`)
    .join('\n\n---\n\n');
  const fb = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast(); } catch(e){ alert('No se pudo copiar.'); }
    document.body.removeChild(ta);
  };
  navigator.clipboard && navigator.clipboard.writeText
    ? navigator.clipboard.writeText(txt).then(showToast).catch(fb)
    : fb();
}
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2000);
}

// ── MODAL ──────────────────────────────────────────────────────
function openModal(title, body, label, cb) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalConfirm').textContent = label;
  modalCb = cb;
  document.getElementById('modal').classList.add('on');
}
function closeModal() {
  document.getElementById('modal').classList.remove('on');
  modalCb = null;
}
document.getElementById('modalConfirm').onclick = () => { closeModal(); if(modalCb) modalCb(); };

// ── NOTICE ─────────────────────────────────────────────────────
function showNotice(msg) {
  const n = document.getElementById('notice');
  n.textContent = msg; n.classList.add('visible');
}
</script>
</body>
</html>
