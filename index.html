<title>Recorrida</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:#f5f0eb; --surface:#fff; --surface2:#fdf8f4; --border:#e8dfd6;
    --mint:#b8e4d4; --mint-d:#5bbf9f; --mint-t:#2d7a61;
    --peach:#f7c8b0; --peach-d:#e87e50; --peach-t:#8a3e1e;
    --lav:#d4c8f0; --lav-d:#9278d8; --lav-t:#4a2f8a;
    --sky:#bcd8f0; --sky-d:#5295cc; --sky-t:#1d4e78;
    --rose:#f5c2cc; --rose-d:#d95c72; --rose-t:#7a1e30;
    --yel:#f7e8a0; --yel-d:#c8a800; --yel-t:#5a4500;
    --text:#2d2520; --muted:#9e8e84;
    --sh:0 2px 12px rgba(0,0,0,0.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--surface);padding:16px 20px 14px;border-bottom:1px solid var(--border)}
  .hdr-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .app-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}
  .app-title strong{color:var(--mint-d)}
  .hdr-date{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px;text-transform:capitalize}
  .new-btn{width:100%;background:var(--yel);color:var(--yel-t);border:2px solid var(--yel-d);border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer;-webkit-appearance:none;text-align:center;transition:all .15s}
  .new-btn:disabled{opacity:.3;cursor:default}
  .new-btn:not(:disabled):active{background:var(--yel-d);color:#fff}
  .notice{margin:12px 16px 0;background:var(--yel);border:1.5px solid var(--yel-d);border-radius:14px;padding:11px 14px;font-size:12px;color:var(--yel-t);line-height:1.55;display:none;font-weight:600}
  .notice.on{display:block}
  .card{background:var(--surface);margin:12px 16px 0;border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--border)}
  .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:10px}
  .search-wrap{position:relative}
  .search-input{width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:11px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none}
  .search-input:focus{border-color:var(--mint-d);background:#fff}
  .search-input::placeholder{color:var(--muted);font-weight:600;font-size:13px}
  .search-results{display:none;margin-top:6px;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
  .search-results.on{display:block}
  .search-item{padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
  .search-item:last-child{border-bottom:none}
  .search-item:active{background:var(--mint)}
  .search-item small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .selected-display{display:none;margin-top:10px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;align-items:center;justify-content:space-between}
  .selected-display.on{display:flex}
  .sel-name{font-size:13px;font-weight:700;color:var(--text)}
  .sel-addr{font-size:11px;color:var(--muted);font-weight:600}
  .change-link{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:700;flex-shrink:0;margin-left:8px}
  .mic-card{background:var(--surface);margin:10px 16px 0;border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:12px}
  .live-box{width:100%;background:#edfaf5;border:2px dashed var(--mint-d);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mint-t);line-height:1.5;font-weight:600;display:none;min-height:40px}
  .live-box.on{display:block}
  .mic-action{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;cursor:pointer;border:2px solid transparent;-webkit-appearance:none;transition:all .18s}
  .mic-start{background:var(--mint);color:var(--mint-t);border-color:var(--mint-d)}
  .mic-start:active{background:var(--mint-d);color:#fff}
  .mic-save{background:var(--mint);color:var(--mint-t);border-color:var(--mint-d)}
  .mic-save:active{background:var(--mint-d);color:#fff}
  .mic-cancel{background:var(--rose);color:var(--rose-t);border-color:var(--rose-d)}
  .mic-cancel:active{background:var(--rose-d);color:#fff}
  .rec-ind{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--rose-d)}
  .rec-dot{width:12px;height:12px;background:var(--rose-d);border-radius:50%;animation:blink 1s infinite;flex-shrink:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .mode-toggle{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .text-card{background:var(--surface);margin:10px 16px 0;border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--border);display:none}
  .text-card.on{display:block}
  .text-row{display:flex;gap:8px;align-items:flex-end}
  .text-area{flex:1;background:var(--surface2);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:11px 14px;resize:none;height:76px;outline:none;transition:border-color .2s;-webkit-appearance:none;line-height:1.5}
  .text-area:focus{border-color:var(--mint-d)}
  .text-area::placeholder{color:var(--muted);font-size:12px}
  .save-btn{background:var(--mint);color:var(--mint-t);border:2px solid var(--mint-d);border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;padding:0 16px;height:76px;cursor:pointer;-webkit-appearance:none;white-space:nowrap;transition:all .15s}
  .save-btn:active{background:var(--mint-d);color:#fff}
  .notas-wrap{flex:1;overflow-y:auto;padding:10px 16px 16px;-webkit-overflow-scrolling:touch}
  .notas-hdr{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:10}
  .notas-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
  .clear-btn{background:none;border:2px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;padding:4px 10px;cursor:pointer;-webkit-appearance:none;transition:all .15s}
  .clear-btn:active{border-color:var(--rose-d);color:var(--rose-d)}
  .empty-box{background:var(--surface);border:1.5px dashed var(--border);border-radius:16px;min-height:64px}
  .entry-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--sh);animation:slidein .22s ease}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .entry-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
  .entry-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .entry-tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;display:inline-block;width:fit-content}
  .entry-juz{font-size:14px;font-weight:800;color:var(--text);padding-left:2px}
  .entry-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:8px}
  .entry-time{font-size:12px;color:var(--muted);font-weight:600}
  .entry-del{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;-webkit-appearance:none;font-weight:700;transition:color .15s}
  .entry-del:active{color:var(--rose-d)}
  .entry-text{font-size:15px;color:var(--text);line-height:1.55;font-weight:600}
  .bottom{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .copy-btn{width:100%;background:var(--peach);color:var(--peach-t);border:2px solid var(--peach-d);border-radius:16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:all .15s;-webkit-appearance:none}
  .copy-btn:not(:disabled):active{background:var(--peach-d);color:#fff;transform:scale(.98)}
  .copy-btn:disabled{opacity:.35;cursor:default}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--mint-d);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;padding:13px 28px;border-radius:50px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(91,191,159,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:center;justify-content:center;padding:24px}
  .modal-ov.on{display:flex}
  .modal-box{background:var(--surface);border-radius:20px;padding:24px 20px 16px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.18);font-family:'Nunito',sans-serif}
  .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
  .modal-body{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:20px}
  .modal-btns{display:flex;gap:10px}
  .m-cancel{flex:1;padding:13px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;-webkit-appearance:none}
  .m-ok{flex:1;padding:13px;border-radius:12px;border:2px solid var(--rose-d);background:var(--rose);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--rose-t);cursor:pointer;-webkit-appearance:none}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <div>
      <div class="app-title"><strong>Recorrida</strong></div>
      <div class="hdr-date" id="hdrDate"></div>
    </div>
  </div>
  <button class="new-btn" id="newBtn" onclick="nuevaRecorrida()" disabled>🗓️ Nueva recorrida</button>
</header>

<div class="notice" id="notice"></div>

<div class="card">
  <div class="lbl">🔍 Juzgado / Sala / SG</div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" inputmode="search"
      placeholder="Ej: 53, Sala I, SG…"
      autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="alBuscar(this.value)">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="selected-display" id="selDisplay">
    <div>
      <div class="sel-name" id="selName"></div>
      <div class="sel-addr" id="selAddr"></div>
    </div>
    <span class="change-link" onclick="cambiarSeleccion()">cambiar</span>
  </div>
</div>

<div class="modal-ov" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-box">
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-btns">
      <button class="m-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="m-ok" id="mOk" onclick="confirmarModal()"></button>
    </div>
  </div>
</div>

<div class="mic-card" id="micCard">
  <div class="live-box" id="liveBox"></div>
  <div id="micIdle" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
    <button class="mic-action mic-start" onclick="iniciarMic()">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 18.93V22h2v-2.07A8 8 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/>
      </svg>
      Iniciar grabación
    </button>
    <div class="mode-toggle" onclick="mostrarTexto()">✏️ Prefiero escribir</div>
  </div>
  <div id="micRec" style="display:none;flex-direction:column;align-items:center;gap:12px;width:100%">
    <div class="rec-ind"><span class="rec-dot"></span> Grabando…</div>
    <div style="display:flex;gap:10px;width:100%">
      <button class="mic-action mic-cancel" onclick="detenerMic(false)" style="flex:1">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
        </svg>
        Cancelar
      </button>
      <button class="mic-action mic-save" onclick="detenerMic(true)" style="flex:1">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
        </svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<div class="text-card" id="textCard">
  <div class="lbl">✏️ Escribí lo que hiciste</div>
  <div class="text-row">
    <textarea class="text-area" id="textArea"
      placeholder="Ej: hice 3 infoleg y conecté una impresora Lexmark…"></textarea>
    <button class="save-btn" onclick="saveText()">Guardar ✓</button>
  </div>
  <div class="mode-toggle" style="margin-top:12px;text-align:center" onclick="mostrarMic()">

function corregirTexto(t){
  let r=t;
  for(const [w,c] of Object.entries(CORRECCIONES))
    r=r.replace(new RegExp(w,'gi'),c);
  return r;
}

let notas=[];

const d=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('hdrDate').textContent=d.charAt(0).toUpperCase()+d.slice(1);
document.getElementById('textArea').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveText();}
});
mostrar();

function alBuscar(val){
  const q=val.trim().toLowerCase();
  const res=document.getElementById('searchResults');
  if(!q){res.classList.remove('on');res.innerHTML='';return;}
  const matches=BASE.filter(item=>{
    const num=item.id.replace(/[a-z]/g,'');
    return num===q||item.label.toLowerCase().includes(q)||item.bld.toLowerCase().includes(q)||item.id.toLowerCase().includes(q);
  }).slice(0,8);
  if(!matches.length){res.classList.remove('on');res.innerHTML='';return;}
  res.innerHTML=matches.map(m=>`<div class="search-item" onclick="elegirItem('${m.id}')">${m.label}<small>${m.addr}</small></div>`).join('');
  res.classList.add('on');
}

function elegirItem(id){
  itemSeleccionado=BASE.find(x=>x.id===id);
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').classList.remove('on');
  document.getElementById('searchResults').innerHTML='';
  document.getElementById('selName').textContent=itemSeleccionado.label;
  document.getElementById('selAddr').textContent=itemSeleccionado.addr;
  document.getElementById('selDisplay').classList.add('on');
}

function cambiarSeleccion(){
  itemSeleccionado=null;
  document.getElementById('selDisplay').classList.remove('on');
  document.getElementById('searchInput').value='';

}

function obtenerActual(){
  if(itemSeleccionado) return {bld:itemSeleccionado.bld,juz:itemSeleccionado.label,color:itemSeleccionado.color};
  return {bld:'Sin edificio',juz:'Sin juzgado',color:'sky'};
}

function mostrarTexto(){
  document.getElementById('micCard').style.display='none';
  document.getElementById('textCard').classList.add('on');
}
function mostrarMic(){
  document.getElementById('textCard').classList.remove('on');
  document.getElementById('micCard').style.display='flex';
}

function saveText(){
  const t=document.getElementById('textArea').value.trim();
  if(!t) return;
  const c=obtenerActual();
  agregarNota(c.bld,c.juz,corregirTexto(t),c.color);
  document.getElementById('textArea').value='';
}

function iniciarMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mostrarAlerta('⚠️ Tu navegador no soporta voz. Usá Safari en el iPhone.');mostrarTexto();return;}
  recognition=new SR();
  recognition.lang='es-AR';
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onstart=()=>{
    grabando=true;
    document.getElementById('micIdle').style.display='none';
    document.getElementById('micRec').style.display='flex';
    document.getElementById('liveBox').classList.add('on');
  };
  recognition.onresult=e=>{
    let fin='',intr='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t; else intr+=t;
    }
    if(fin) transcripcion+=fin;
    document.getElementById('liveBox').textContent=transcripcion+intr;
  };
  recognition.onerror=e=>{
    recognition.onend=null;grabando=false;resetearMic();
    if(e.error==='not-allowed'||e.error==='service-not-allowed')
      mostrarAlerta('⚠️ Micrófono denegado. Necesitás abrir desde HTTPS. Usá modo texto.');
    else if(e.error!=='aborted')
      mostrarAlerta('⚠️ Error micrófono: '+e.error);
    mostrarTexto();
  };
  recognition.onend=()=>{if(grabando){try{recognition.start();}catch(e){}}};
  transcripcion='';
  try{recognition.start();}catch(e){mostrarAlerta('No se pudo iniciar el micrófono.');mostrarTexto();}
}

function detenerMic(guardar){
  grabando=false;
  if(recognition){recognition.onend=null;recognition.stop();recognition=null;}
  resetearMic();
  if(guardar){
    const t=corregirTexto(transcripcion.trim());
    if(t){
      const c=obtenerActual();
      agregarNota(c.bld,c.juz,t,c.color);
    }
  }
  transcripcion='';
  document.getElementById('liveBox').textContent='';
}

function resetearMic(){
  document.getElementById('micIdle').style.display='flex';
  document.getElementById('micRec').style.display='none';
  document.getElementById('liveBox').classList.remove('on');
}

function agregarNota(bld,juz,text,color){
  const time=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  notas.unshift({id:Date.now(),bld,juz,text,time,color});
  guardarLocal();
  mostrar();
}

function borrarNota(id){
  notas=notas.filter(e=>e.id!==id);
  guardarLocal();
  mostrar();
}

function borrarTodo(){
  if(!notas.length) return;
  abrirModal('¿Borrar todas las notas?','','Borrar todo',()=>{notas=[];guardarLocal();mostrar();});
}

function nuevaRecorrida(){
  if(!notas.length) return;
  abrirModal('¿Nueva recorrida?','Se borran todas las notas del día.','Borrar y empezar',()=>{
    notas=[];guardarLocal();mostrar();
    itemSeleccionado=null;
    document.getElementById('selDisplay').classList.remove('on');
    document.getElementById('searchInput').value='';
  });
}

function guardarLocal(){
  try{localStorage.setItem('juz_v3',JSON.stringify(notas));}catch(e){}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function mostrar(){
  const n=notas.length;
  document.getElementById('copyBtn').disabled=n===0;
  document.getElementById('newBtn').disabled=n===0;
  const list=document.getElementById('entryList');
  if(!n){list.innerHTML='<div class="empty-box"></div>';return;}
  list.innerHTML=notas.map(e=>{
    const s=COLORES[e.color]||COLORES.sky;
    return `<div class="entry-card"><div class="entry-top"><div class="entry-left"><span class="entry-tag" style="background:${s.bg};color:${s.col}">${esc(e.bld)}</span><span class="entry-juz">${esc(e.juz)}</span></div><div class="entry-right"><span class="entry-time">${e.time}</span><button class="entry-del" onclick="borrarNota(${e.id})">×</button></div></div><div class="entry-text">${esc(e.text)}</div></div>`;
  }).join('');
}

function copiarTodo(){
  if(!notas.length) return;
  const txt=[...notas].reverse().map(e=>`[${e.time}] ${e.bld} — ${e.juz}\n${e.text}`).join('\n\n---\n\n');
  const fb=()=>{
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');mostrarAviso();}catch(e){alert('No se pudo copiar.');}
    document.body.removeChild(ta);
  };
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(mostrarAviso).catch(fb):fb();
}

function mostrarAviso(){
  const t=document.getElementById('toast');
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2000);
}

function abrirModal(title,body,label,cb){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').textContent=body;
  document.getElementById('mOk').textContent=label;
  accionModal=cb;
  document.getElementById('modal').classList.add('on');
}

function cerrarModal(){
  document.getElementById('modal').classList.remove('on');
  accionModal=null;
}

function confirmarModal(){
  const cb=accionModal;
  cerrarModal();
  if(cb) cb();
}

function mostrarAlerta(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;
  n.classList.add('on');
}
